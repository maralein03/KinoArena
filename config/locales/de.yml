de:
  date:
    abbr_day_names: [So, Mo, Di, Mi, Do, Fr, Sa]
    abbr_month_names: [~, Jan., Feb., März, Apr., Mai, Juni, Juli, Aug., Sept., Okt., Nov., Dez.]
    day_names: [Sonntag, Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag]
    formats:
      default: "%d.%m.%Y"
      long: "%e. %B %Y"
      short: "%e. %b"
    month_names: [~, Januar, Februar, März, April, Mai, Juni, Juli, August, September, Oktober, November, Dezember]
  time:
    am: vormittags
    formats:
      default: "%A, %d. %B %Y, %H:%M Uhr"
      long: "%A, %d. %B %Y, %H:%M Uhr"
      short: "%d. %B, %H:%M Uhr"
    pm: nachmittags
  activerecord:
    models:
      user: Benutzer
      movie: Film
      auditorium: Saal
      seat: Sitzplatz
      showtime: Vorstellung
      booking: Buchung
    attributes:
      user:
        name: Name
        email_address: E-Mail-Adresse
        password: Passwort
        password_confirmation: Passwortbestätigung
        admin: Administrator
      movie:
        title: Titel
        description: Beschreibung
        duration_minutes: Dauer
        poster_url: Poster-URL
      showtime:
        movie: Film
        auditorium: Saal
        start_time: Beginn
        price: Preis
      booking:
        seat: Sitzplatz
        seat_id: Sitzplatz
        showtime: Vorstellung
    errors:
      messages:
        record_invalid: "Validierung fehlgeschlagen: %{errors}"
        taken: ist bereits vergeben
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: muss ausgefüllt werden
      confirmation: stimmt nicht mit %{attribute} überein
      greater_than: muss grösser als %{count} sein
      greater_than_or_equal_to: muss grösser oder gleich %{count} sein
      inclusion: ist kein gültiger Wert
      invalid: ist nicht gültig
      less_than_or_equal_to: muss kleiner oder gleich %{count} sein
      not_a_number: ist keine Zahl
      not_an_integer: muss eine ganze Zahl sein
      taken: ist bereits vergeben
      too_long: ist zu lang (maximal %{count} Zeichen)
      too_short: ist zu kurz (mindestens %{count} Zeichen)
